  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-copy">
        <h2>Hotel-grade comfort, made simple.</h2>
        <p>Browse our core range. Filter by category or search by name/SKU.</p>

          <input id="search" class="search" type="search" placeholder="Search products…" aria-label="Search products" />
          <select id="category" class="select" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>

      </div>

    </div>

  </section>

      <div><span>Subtotal (AED)</span><strong id="subtotal">—</strong></div>
      <div><span>VAT 5% (AED)</span><strong id="vat">—</strong></div>
      <div class="grand"><span>Grand Total (AED)</span><strong id="grand">—</strong></div>
    </aside>
  </main>

  <script>
    // ====== DATA (from your PDF extraction) ======

      {"No":12,"Category":"Bed Ware","Item Name":"Queen Pillow","Description":"1000gm, 100% Cotton Velour, Double Piping, 50x70cm","Quantity":100,"Unit Price (AED)":14.40,"Total (AED)":1440.00,"image":"/prods/12.jpg"},

      {"No":18,"Category":"Towels & Linen","Item Name":"Bath Robe (Large)","Description":"100% Cotton Velour, Kimono Style, 450gr, White, 125 cm long","Quantity":100,"Unit Price (AED)":48.00,"Total (AED)":4800.00,"image":"/prods/18.jpg"},
      {"No":19,"Category":"Towels & Linen","Item Name":"Bath Mat","Description":"50x80 cm, 1000 GSM, Super Soft, Extra Absorbent, White","Quantity":100,"Unit Price (AED)":12.00,"Total (AED)":1200.00,"image":"/prods/19.jpg"},
      {"No":20,"Category":"Towels & Linen","Item Name":"Shower Curtain","Description":"White 180x180 cm, Spa Hotel Quality, Waterproof, Mildew Resistant","Quantity":100,"Unit Price (AED)":17.00,"Total (AED)":1700.00,"image":"/prods/20.jpg"},
      {"No":21,"Category":"Towels & Linen","Item Name":"Pool Towel","Description":"90x180 cm, 100% Cotton, Cabana Stripe, Highly Absorbent","Quantity":100,"Unit Price (AED)":28.00,"Total (AED)":2800.00,"image":"/prods/21.jpg"},
      {"No":22,"Category":"Prayer Mat","Item Name":"Islamic Prayer Mat (Alsaqer Turkey)","Description":"Soft Touch with Cotton Padded Back, Premium Design, Made in Turkey","Quantity":100,"Unit Price (AED)":13.75,"Total (AED)":1375.00,"image":"/prods/22.jpg"}
    ];

    // ====== helpers ======
    const money = n => new Intl.NumberFormat('en-AE', {style:'currency', currency:'AED'}).format(n);

    // ====== render filters ======
    (function initFilters(){
      const categories = Array.from(new Set(products.map(p => p.Category))).sort();
      const sel = document.getElementById('category');
      categories.forEach(c=>{
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });

      // header quick filter clicks
      document.querySelectorAll('.site-nav a[data-filter]')
        .forEach(a => a.addEventListener('click', e => {
          e.preventDefault();
          sel.value = a.dataset.filter;
          document.getElementById('search').value = '';
          render();
        }));
    })();

    // ====== rendering logic ======
    function render(){
      const q = document.getElementById('search').value.trim().toLowerCase();
      const cat = document.getElementById('category').value;

      const filtered = products.filter(p => {
        const matchesCat = !cat || p.Category === cat;
        const hay = (p["Item Name"] + " " + p.Description + " " + (p.Category||"") + " " + (p.No||"")).toLowerCase();
        const matchesQ = !q || hay.includes(q);
        return matchesCat && matchesQ;
      });

      const wrap = document.getElementById('catalog');
      wrap.innerHTML = '';

      for (const p of filtered){
        const card = document.createElement('article');
        card.className = 'card';

        // optional image (you fill "image" field later)
        const hasImg = p.image && p.image.trim().length > 0;
        if (hasImg){
          const img = document.createElement('img');
          img.className = 'card-img';
          img.loading = 'lazy';
          img.alt = `${p["Item Name"]} photo`;
          img.src = p.image;
          card.appendChild(img);
        }

        card.insertAdjacentHTML('beforeend', `
          <header class="card-head">
            <h3>${p["Item Name"]}</h3>
            <span class="tag">${p.Category}</span>
          </header>
          <p class="card-lead">${p.Description}</p>
          <ul class="specs">
            <li><strong>Qty:</strong> ${p.Quantity}</li>
            <li><strong>Unit:</strong> ${money(p["Unit Price (AED)"])}</li>
            <li><strong>Line Total:</strong> ${money(p["Total (AED)"])}</li>
            <li class="muted"><strong>SKU:</strong> WARM-${String(p.No).padStart(3,'0')}</li>
          </ul>
          <footer class="card-foot">
            <span class="sku">#${String(p.No).padStart(3,'0')}</span>
            
          </footer>
        `);
        wrap.appendChild(card);
      }

      // totals (use full list, not only filtered)
      const subtotal = products.reduce((s,p)=>s + Number(p["Total (AED)"]||0), 0);
      const vat = subtotal * 0.05;
      const grand = subtotal + vat;
      document.getElementById('subtotal').textContent = money(subtotal);
      document.getElementById('vat').textContent = money(vat);
      document.getElementById('grand').textContent = money(grand);
    }

    // Events
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('category').addEventListener('change', render);

    // init
    document.getElementById('year').textContent = new Date().getFullYear();
    render();
  </script>
</body>
